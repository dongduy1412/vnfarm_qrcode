[platformio]
default_envs = s3tim

[env:s3tim]
platform = espressif32@6.13.0
board = esp32-s3-devkitc-1
framework = arduino
board_upload.flash_size = 16MB
board_upload.after_reset = watchdog_reset
board_build.flash_mode = qio
board_build.partitions = partitions.csv
board_build.arduino.memory_type = qio_opi
build_flags =
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D CORE_DEBUG_LEVEL=0
monitor_speed = 115200
upload_port = COM5
monitor_port = COM5
upload_speed = 921600
lib_deps =
    adafruit/Adafruit ST7735 and ST7789 Library@1.10.4
    adafruit/Adafruit GFX Library@1.13.0
    adafruit/Adafruit BusIO@1.17.4
    adafruit/Adafruit seesaw Library@1.7.9
    ricmoo/QRCode@0.0.1
    bblanchon/ArduinoJson@6.21.5

; Local LAN test only. The normal s3tim environment still requires HTTPS.
[env:s3tim_local]
extends = env:s3tim
build_flags =
    ${env:s3tim.build_flags}
    -D QR_ALLOW_HTTP_TEST=1
    -D QR_DEFAULT_CHECKIN_URL=\"http://192.168.1.221:8765/checkin\"

